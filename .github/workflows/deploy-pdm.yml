name: Deploy PDM to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pamodzici-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Validate before production upload
        run: |
          npm ci
          npm run validate
          php tests/payments/ledger.php
          python3 tests/payments/test_http.py
          python3 tests/enquiry/test_http.py
          npx playwright install --with-deps chromium
          npm run test:browser
          node tests/navigation/browser.cjs
          node tests/navigation/motion.cjs
          node tests/navigation/wfe-redesign.cjs
          test -s index.html

      - name: Prepare only the live PDM website
        run: |
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'deploy' --exclude 'tests' --exclude '*.md' --exclude 'api/payments/config.example.php' \
            --exclude 'node_modules' --exclude 'scripts' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'src' --exclude '.astro' --exclude 'build-v3' --exclude 'public-v3' --exclude 'astro.config.mjs' --exclude 'tsconfig.json' \
            --exclude 'eslint.config.mjs' --exclude 'stylelint.config.mjs' --exclude '.prettierrc.json' --exclude '.prettierignore' --exclude '.editorconfig' \
            ./ deploy/

      - name: Upload to pamodzici.com
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "deploy/*"
          target: ${{ secrets.CPANEL_TARGET }}
          strip_components: 1
          overwrite: true
