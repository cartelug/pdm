name: Front-end quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Build, navigation and protected campaign checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Check
        run: npm run validate

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Campaign ledger and HTTP fixtures
        run: |
          php tests/payments/ledger.php
          python3 tests/payments/test_http.py
          python3 tests/enquiry/test_http.py

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Campaign browser regression
        run: npm run test:browser

      - name: Institutional browser regression
        run: node tests/navigation/browser.cjs

      - name: Motion regression
        run: node tests/navigation/motion.cjs
