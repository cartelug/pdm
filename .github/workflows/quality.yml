name: Front-end quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Build, navigation and protected campaign checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Check
        run: npm run validate

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Campaign ledger and HTTP fixtures
        run: |
          php tests/payments/ledger.php
          python3 tests/payments/test_http.py
          python3 tests/enquiry/test_http.py

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Walk for Education redesign regression
        run: node tests/navigation/wfe-redesign.cjs

      - name: Campaign browser regression
        run: npm run test:browser

      - name: Institutional browser regression
        run: node tests/navigation/browser.cjs

      - name: Motion regression
        run: node tests/navigation/motion.cjs

      - name: Accessibility scan (axe, WCAG 2.2 A and AA)
        run: node tests/quality/a11y.cjs

      - name: Speed budget (throttled phone lab test)
        run: node tests/quality/speed.cjs

      # No sideways scroll, clipped content, tiny tap targets or text under 13 px at 320 to 1536 px, in landscape
      # and with text at 200%. The list was cleaned on 21 October 2026, so this now fails the build.
      - name: Responsive gate (320 to 1536 px, landscape, 200% text)
        run: node tests/quality/responsive.cjs --strict

      # The findings are in build-time tooling and need a breaking Astro upgrade, so this reports and does not fail.
      - name: Dependency audit (report)
        continue-on-error: true
        run: npm audit --audit-level=high
