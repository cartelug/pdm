name: Front-end quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Build, navigation and protected campaign checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Check
        run: npm run validate

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Campaign ledger and HTTP fixtures
        run: |
          node tests/operations/reports.cjs
          php tests/payments/ledger.php
          python3 tests/payments/test_http.py
          python3 tests/operations/test_http.py
          python3 tests/operations/test_setup.py
          python3 tests/enquiry/test_http.py

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Walk for Education redesign regression
        run: node tests/navigation/wfe-redesign.cjs

      - name: Operations and actual PNG export acceptance
        run: node tests/operations/browser.cjs

      - name: Campaign browser regression
        run: npm run test:browser

      - name: Institutional browser regression
        run: node tests/navigation/browser.cjs

      - name: Motion regression
        run: node tests/navigation/motion.cjs

      - name: Accessibility scan (axe, WCAG 2.2 A and AA)
        run: node tests/quality/a11y.cjs

      - name: Speed budget (throttled phone lab test)
        run: node tests/quality/speed.cjs

      # All public pages at normal zoom, across phone/tablet/header boundaries, landscape and 200% text.
      # Broken heading words, narrow heading columns and clipped wrapped text are also reported for review.
      - name: Responsive gate (320 to 2560 px, landscape, 200% text)
        run: node tests/quality/responsive.cjs --strict --json responsive-report.json

      - name: Save responsive measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-report
          path: responsive-report.json
          if-no-files-found: ignore
          retention-days: 14

      # The findings are in build-time tooling and need a breaking Astro upgrade, so this reports and does not fail.
      - name: Dependency audit (report)
        continue-on-error: true
        run: npm audit --audit-level=high
