# BEGIN PDM CLEAN URLS
<IfModule mod_rewrite.c>
  RewriteEngine On

  # Only redirect explicit requests, never an internal directory-index lookup.
  # Apache preserves the query string, and browsers preserve fragment identifiers.
  RewriteCond %{THE_REQUEST} \s/+([^\s?]+\.html)[?\s] [NC]
  RewriteCond %{REQUEST_URI}#/%1 ^([^#]+)#\1$
  RewriteRule ^(.*/)?index\.html$ /$1 [R=301,L]

  # Legacy stubs such as about.html point straight to the existing folder page.
  RewriteCond %{THE_REQUEST} \s/+([^\s?]+\.html)[?\s] [NC]
  RewriteCond %{REQUEST_URI}#/%1 ^([^#]+)#\1$
  RewriteCond %{REQUEST_FILENAME} ^(.+)\.html$
  RewriteCond %1/index.html -f
  RewriteRule ^([a-z0-9/_-]+)\.html$ /$1/ [R=301,L]

  # Explicit standalone pages: LiteSpeed may retain the filename of a previous
  # internal rewrite, so these redirects must not depend on REQUEST_FILENAME.
  RewriteCond %{THE_REQUEST} \s/+([^\s?]+\.html)[?\s] [NC]
  RewriteCond %{REQUEST_URI}#/%1 ^([^#]+)#\1$
  RewriteRule ^(admin/(?:quick|wfe|operations/(?:start|guide))|404)\.html$ /$1 [R=301,L]

  # Serve an existing standalone HTML document at its extensionless URL.
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteCond %{REQUEST_FILENAME}.html -f
  RewriteRule ^([a-z0-9/_-]+)$ $1.html [L]
</IfModule>
# END PDM CLEAN URLS
