<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000"><title>How your support moves forward</title><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F4F1EA" stroke="none"/><text x="80" y="86" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#052B54">PCI / WALK FOR EDUCATION</text><path d="M80 118 L1520 118" fill="none" stroke="#D8D3C8" stroke-width="1" stroke-linecap="round"/><text x="80" y="206" font-family="Fraunces, DejaVu Serif, serif" font-size="57" font-weight="400" fill="#052B54">How your support moves forward</text><rect x="80" y="320" width="700" height="245" rx="22" fill="white" stroke="none"/><circle cx="137" cy="381" r="29" fill="#052B54" stroke="none" stroke-width="2"/><text x="119" y="389" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="white">01</text><text x="190" y="392" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#052B54">Pledge your steps</text><text x="190" y="446" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">Your commitment is recorded</text><text x="190" y="481" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">with a campaign reference.</text><path d="M190 525 L705 525" fill="none" stroke="#00A6D8" stroke-width="3" stroke-linecap="round"/><rect x="820" y="320" width="700" height="245" rx="22" fill="white" stroke="none"/><circle cx="877" cy="381" r="29" fill="#052B54" stroke="none" stroke-width="2"/><text x="859" y="389" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="white">02</text><text x="930" y="392" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#052B54">Report your payment</text><text x="930" y="446" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">Submit the approved channel</text><text x="930" y="481" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">and transaction reference.</text><path d="M930 525 L1445 525" fill="none" stroke="#00A6D8" stroke-width="3" stroke-linecap="round"/><rect x="80" y="605" width="700" height="245" rx="22" fill="white" stroke="none"/><circle cx="137" cy="666" r="29" fill="#052B54" stroke="none" stroke-width="2"/><text x="119" y="674" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="white">03</text><text x="190" y="677" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#052B54">PCI checks the payment</text><text x="190" y="731" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">The finance team verifies</text><text x="190" y="766" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">that the money was received.</text><path d="M190 810 L705 810" fill="none" stroke="#00A6D8" stroke-width="3" stroke-linecap="round"/><rect x="820" y="605" width="700" height="245" rx="22" fill="white" stroke="none"/><circle cx="877" cy="666" r="29" fill="#052B54" stroke="none" stroke-width="2"/><text x="859" y="674" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="white">04</text><text x="930" y="677" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#052B54">Progress is confirmed</text><text x="930" y="731" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">Verified support can be added</text><text x="930" y="766" font-family="Montserrat, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62747D">to the public campaign total.</text><path d="M930 810 L1445 810" fill="none" stroke="#00A6D8" stroke-width="3" stroke-linecap="round"/></svg>